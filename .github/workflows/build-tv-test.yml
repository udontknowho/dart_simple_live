name: build-tv-test
on:
  workflow_dispatch:
  push:
    branches: [dev]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.x"
          cache: true
      - name: 写入签名配置（用仓库内自带的测试密钥）
        run: |
          cd simple_live_tv_app/android
          printf 'storeFile=test.jks\nstorePassword=simplelivetest\nkeyPassword=simplelivetest\nkeyAlias=simplelivetv\n' > key.properties
          cat key.properties
      - name: 拉依赖并打包
        run: |
          cd simple_live_tv_app
          flutter pub get
          flutter build apk --release --split-per-abi
      - uses: actions/upload-artifact@v4
        with:
          name: android_tv
          path: simple_live_tv_app/build/app/outputs/flutter-apk/*.apk
